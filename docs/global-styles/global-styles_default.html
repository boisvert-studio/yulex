<style>
/* Client-First V3 default global styles (Global / Styles > global-styles_default). Do not edit; project CSS goes in global-styles_custom. */
/* Text clarity */
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-smoothing: antialiased; text-rendering: optimizeLegibility; }
/* Focus state */
*[tabindex]:focus-visible, button:focus-visible, a:focus-visible, [role="button"]:focus-visible, input[type="file"]:focus-visible {
  outline: var(--_sizes---focus--width) solid var(--_theme---system--focus-state);
  outline-offset: var(--_sizes---focus--offset);
}
/* Text selection */
::selection { background: var(--_theme---system--selection-background); color: var(--_theme---system--selection-text); }
::-moz-selection { background: var(--_theme---system--selection-background); color: var(--_theme---system--selection-text); }
/* Rich text: no top margin on the first child, no bottom margin on the last */
.w-richtext > :not(div):first-child, .w-richtext > div:first-child > :first-child { margin-top: 0 !important; }
.w-richtext > :last-child, .w-richtext ol li:last-child, .w-richtext ul li:last-child { margin-bottom: 0 !important; }
/* Line clamp */
.text-style-1line { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.text-style-2lines { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.text-style-3lines { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
</style>
